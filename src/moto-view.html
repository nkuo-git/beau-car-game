<!doctype html>
<html><head><meta charset="utf-8">
<script type="importmap">{"imports":{"three":"/three/build/three.module.js","three/addons/":"/three/examples/jsm/"}}</script>
<style>html,body{margin:0;height:100%;background:transparent;overflow:hidden}canvas{display:block}</style>
</head><body>
<script type="module">
// 摩托車做圖用的看車頁（第 59 批；跟 z2-view.html 一樣，但是不經過 buildCar：車殼 glb＋moto-spec.js 的零件）：?car=f6|n4&v=front34&paint=%23…&rider=1&steer=&helmet=%23…&bg=none&W=&H=
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { MAT } from './parts.js';
import { fullBody } from './supra.js';
import { motoBuild, motoRide, motoSteer, MOTO_RIDE } from './moto-spec.js';
const Q = new URLSearchParams(location.search), key = Q.get('car') || 'f6';
const W = +(Q.get('W') || 1200), H = +(Q.get('H') || 800);
const gltf = await new GLTFLoader().loadAsync(`body-${key}-q.glb?t=${Date.now()}`);
const paint = new THREE.MeshPhysicalMaterial({ color: new THREE.Color(Q.get('paint') || (key === 'f6' ? '#1d5fc4' : '#2a2b2e')), metalness: 0.1, roughness: 0.3, clearcoat: 1, clearcoatRoughness: 0.03 });
const mats = { rubber: MAT.rubber(), chrome: MAT.chrome(), alu: MAT.alu(), disc: MAT.disc(), black: MAT.black(), polish: MAT.polish(), barrelIn: new THREE.MeshPhysicalMaterial({ color: 0x9aa0a6, roughness: 0.35, metalness: 1 }) };
const car = new THREE.Group(), body = new THREE.Group(); body.name = 'body';
body.add(new THREE.Mesh(fullBody(gltf.scene), paint)); // 右半邊＋鏡射（量化的 glb 有節點的縮放：要照 matrixWorld 算）
const B = motoBuild(key, body, paint, mats);
car.add(body);
let C = null;
if (Q.has('rider')) {
  const { buildCharacter, PLAYER_LOOK } = await import('./character.js');
  C = buildCharacter({ ...PLAYER_LOOK, hat: 'helmet', hatColor: Q.get('helmet') || '#f1f1ee' }, { state: 'sit', shadow: false, plant: false });
  C.group.position.fromArray(MOTO_RIDE[key].at);
  const st = +(Q.get('steer') || 0);
  motoSteer(body, st, key); for (let i = 0; i < 40; i++) motoRide(C, st, 1 / 30, key);
  body.add(C.group);
}
if (Q.has('lean')) car.rotation.x = +Q.get('lean') * Math.PI / 180;
const r = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
r.setSize(W, H); r.setPixelRatio(1); r.toneMapping = THREE.ACESFilmicToneMapping; r.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(r.domElement);
const scene = new THREE.Scene(), dark = Q.get('studio') === 'dark';
scene.environment = new THREE.PMREMGenerator(r).fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = dark ? 0.35 : 1;
if (Q.get('bg') !== 'none') scene.background = new THREE.Color(dark ? 0x15161a : 0xd9dce1);
const sun = new THREE.DirectionalLight(0xffffff, dark ? 1.2 : 2.2); sun.position.set(3, 6, 2); scene.add(sun, new THREE.HemisphereLight(0xffffff, 0x444444, dark ? 0.2 : 0.5));
if (Q.get('bg') !== 'none') { const fl = new THREE.Mesh(new THREE.CircleGeometry(8, 64), new THREE.MeshStandardMaterial({ color: dark ? 0x222327 : 0xc4c7cc, roughness: 0.8 })); fl.rotation.x = -Math.PI / 2; fl.position.y = -0.001; scene.add(fl); }
scene.add(car);
const CAMS = { front34: { a: 35, d: 4.4, h: 1.35, tx: 0, ty: 0.62, fov: 32 }, rear34: { a: 145, d: 4.4, h: 1.35, tx: -0.05, ty: 0.62, fov: 32 },
  side: { a: 90, d: 6.0, h: 0.72, tx: 0, ty: 0.6, fov: 26 }, front: { a: 0, d: 6, h: 0.75, tx: 0, ty: 0.6, fov: 20 }, rear: { a: 180, d: 6, h: 0.75, tx: 0, ty: 0.6, fov: 20 },
  low: { a: 28, d: 3.4, h: 0.45, tx: 0.2, ty: 0.55, fov: 40 }, top: { a: 90, d: 0.01, h: 8, tx: 0, ty: 0, fov: 25 } };
const v = Q.get('v') || 'front34', c = v === 'custom' ? Object.fromEntries(['a', 'd', 'h', 'tx', 'ty', 'tz', 'fov'].map((k) => [k, +(Q.get(k) || 0)])) : CAMS[v];
const cam = new THREE.PerspectiveCamera(c.fov, W / H, 0.05, 200), a = c.a * Math.PI / 180;
cam.position.set(c.tx + Math.cos(a) * c.d, c.h, (c.tz || 0) - Math.sin(a) * c.d);
if (v === 'top') cam.up.set(-1, 0, 0);
cam.lookAt(c.tx, c.ty, c.tz || 0);
r.render(scene, cam);
window.info = { calls: r.info.render.calls, tris: r.info.render.triangles };
window.done = true;
</script></body></html>
