<!doctype html>
<!-- 看圓環車庫（tower.js）的小工具：node tshot.mjs out.png 'mode=page&cam=6,2.5,4&look=0,0.8,0' -->
<!--   mode＝page（車庫頁：沒有燈、房間的環境貼圖）／town（村子：太陽、天空）；cam、look＝鏡頭在哪、看哪；lift＝電梯在第幾層；trophy＝獎盃幾個；door＝鐵捲門 0–1；q＝high／low -->
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"/three/build/three.module.js","three/addons/":"/three/examples/jsm/"}}</script></head><body>
<script type="module">
import * as THREE from 'three';
import { buildRoom, TOWER_BAYS, towerFy } from './tower.js';
const q = new URLSearchParams(location.search), W = +q.get('W') || 1200, H = +q.get('H') || 800, mode = q.get('mode') || 'page';
const num = (k, d) => (q.get(k) || d).split(',').map(Number);
const renderer = new THREE.WebGLRenderer({ antialias: true }); renderer.setSize(W, H); renderer.toneMapping = THREE.ACESFilmicToneMapping; document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(), cam = new THREE.PerspectiveCamera(+q.get('fov') || 50, W / H, 0.1, 500);
const R = buildRoom(renderer, { quality: q.get('q') || 'high', exterior: mode === 'town' }); scene.add(R.group);
if (mode === 'town') {
  scene.background = new THREE.Color(0x9fc4e4); scene.add(new THREE.HemisphereLight(0xdfefff, 0x6f7a5f, 1.0)); const sun = new THREE.DirectionalLight(0xffffff, 1.6); sun.position.set(40, 80, 30); scene.add(sun);
  const g = new THREE.Mesh(new THREE.PlaneGeometry(400, 400), new THREE.MeshStandardMaterial({ color: 0x7c9a5a })); g.rotation.x = -Math.PI / 2; g.position.y = -0.01; scene.add(g);
} else { scene.background = new THREE.Color(0x060708); scene.environment = R.env; }
R.setTrophies(+(q.get('trophy') ?? 9)); R.door.t = +(q.get('door') ?? 0);
const box = (c) => { const g = new THREE.Group(), m = new THREE.MeshStandardMaterial({ color: c, roughness: 0.3, metalness: 0.4 }); const b = new THREE.Mesh(new THREE.BoxGeometry(4.4, 0.9, 1.9), m); b.position.y = 0.6; g.add(b); const t = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.55, 1.6), m); t.position.set(-0.3, 1.3, 0); g.add(t); return g; };
const me = box(0xff6a1f); R.platform.add(me);
const cols = [0x2a4fb0, 0xe8e8e6, 0xc8102e, 0x1d1e22, 0xf2b80f, 0x2f5fc8, 0xd0d3d6];
for (let i = 0; i < +(q.get('cars') ?? 14); i++) R.put(i, box(cols[i % cols.length]), 'car' + i);
const lf = +(q.get('lift') || 0); R.liftSnap(lf, +(q.get('rot') || 0)); R.setFloor(+(q.get('floor') ?? lf));
const c = num('cam', '9,2.6,6'), l = num('look', '0,0.8,0'); cam.position.set(...c); cam.lookAt(...l);
if (q.get('clamp')) { const p = cam.position.clone(); R.camClamp(p, new THREE.Vector3(...l)); cam.position.copy(p); cam.lookAt(...l); }
R.cull(cam);
await R.ready;
renderer.render(scene, cam); renderer.render(scene, cam);
window.info = { calls: renderer.info.render.calls, tris: renderer.info.render.triangles, cols: R.colliders().length, ceil: R.ceilingAt(c[0], c[2]) };
window.done = true;
</script></body></html>
