<script>
/* 跟汽車那頁一樣的明暗和主色（在汽車那頁的齒輪裡改）；先套上再畫，才不會閃一下 */
(function () {
  var r = document.documentElement, t = null, a = null;
  try { t = localStorage.getItem("carid.theme"); a = localStorage.getItem("carid.accent"); } catch (e) { /* 不給用就用預設 */ }
  var mode = t === "light" || t === "dark" || t === "system" ? t : "dark";
  if (mode === "system") r.removeAttribute("data-theme"); else r.setAttribute("data-theme", mode);
  var m = /^#?([0-9a-f]{6})$/i.exec(String(a || "").trim());
  if (!m) return;
  var n = parseInt(m[1], 16), rgb = [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  var dark = mode === "dark" || (mode === "system" && !!(window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches));
  var lum = function (c) {
    var l = c.map(function (v) { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); });
    return 0.2126 * l[0] + 0.7152 * l[1] + 0.0722 * l[2];
  };
  if (dark && lum(rgb) < 0.18) rgb = rgb.map(function (v) { return Math.round(v + (255 - v) * 0.24); });
  var hex = "#" + rgb.map(function (v) { return v.toString(16).padStart(2, "0"); }).join("");
  r.style.setProperty("--accent", hex);
  r.style.setProperty("--accent-ink", lum(rgb) > 0.19 ? "#0E0F12" : "#FFFFFF");
  r.style.setProperty("--accent-wash", "rgba(" + rgb.join(", ") + ", " + (dark ? 0.16 : 0.09) + ")");
})();
</script>
